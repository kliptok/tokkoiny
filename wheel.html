
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#170b2d">
  <title>Клипбокс | ТокКоины</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">

  <style>
    .wheel-page {
      width: min(100% - 30px, 900px);
      margin: 35px auto;
      text-align: center;
    }

    .back-home {
      display: inline-block;
      margin-bottom: 20px;
      padding: 11px 22px;
      border: 1px solid #9366bd;
      border-radius: 10px;
      color: #f2c5ff;
      text-decoration: none;
      font-size: 14px;
      transition: .2s;
    }

    .back-home:hover {
      background: #492568;
      border-color: #d78cff;
      transform: translateY(-2px);
    }

    .wheel-frame {
      width: 100%;
      min-height: 720px;
      border: 1px solid #7043a0;
      border-radius: 20px;
      overflow: hidden;
      background: #170b2d;
    }

    .wheel-frame iframe {
      display: block;
      width: 100%;
      height: 720px;
      border: 0;
    }

    @media (max-width: 600px) {
      .wheel-frame,
      .wheel-frame iframe {
        min-height: 780px;
        height: 780px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header wheel-header">
    <a class="brand" href="index.html"><img src="images/tokcoin.webp" alt="" class="brand-coin"><span>Аватарский KlipTok | накопительная система</span></a>
    <a class="back-home" href="index.html">← На главную</a>
  </header>
  <main class="wheel-page">

    <h1>Скорее открой подарок!</h1>
    <p>Испытай удачу и получи свой приз!</p>

    <div class="wheel-frame">
      <iframe
        src="https://script.google.com/macros/s/AKfycbyDz_Gq1Zz_5ZTL1SllLeJV0CNLbZ1BalijphLYxo42WWk6vd04W6at1Bi0s0tOOpaJ/exec"
        title="Колесо фортуны"
        loading="lazy">
      </iframe>
    </div>

  </main>
<script>
(function () {
  const logo = document.querySelector('.brand');
  if (!logo) return;

  const STORAGE_KEY = 'kliptok_easter_egg';
  const TIME_KEY = 'kliptok_easter_time';

  logo.addEventListener('click', function (event) {
    // Логотип не переводит на главную: считаем пять быстрых нажатий.
    event.preventDefault();

    const now = Date.now();
    const lastTime = Number(sessionStorage.getItem(TIME_KEY) || 0);
    let clicks = Number(sessionStorage.getItem(STORAGE_KEY) || 0);

    if (now - lastTime > 15000) {
      clicks = 0;
    }

    clicks++;
    sessionStorage.setItem(STORAGE_KEY, clicks);
    sessionStorage.setItem(TIME_KEY, now);

    if (clicks >= 5) {
      sessionStorage.removeItem(STORAGE_KEY);
      sessionStorage.removeItem(TIME_KEY);
      sessionStorage.setItem('kliptok_show_secret', 'yes');
      window.location.reload();
    }
  });

  // Показываем послание после пятого нажатия
  if (sessionStorage.getItem('kliptok_show_secret') === 'yes') {
    sessionStorage.removeItem('kliptok_show_secret');

    const popup = document.createElement('div');
    popup.innerHTML = `
      <div class="anton-secret-overlay">
        <div class="anton-secret-box">
          <div class="anton-secret-icon">🐈‍⬛</div>
          <div class="anton-secret-title">Секретное послание!</div>
          <p>
            Мяу! Ты нашёл мою тайну! 💜
            <br><br>
            Не каждый знает, что на сайте KlipTok
            спрятаны секреты. Но теперь ты один из посвящённых!
          </p>
          <div class="anton-secret-sign">Твой котик Антон ✨</div>
          <button class="anton-secret-close">Забрать секрет себе</button>
        </div>
      </div>
    `;

    document.body.appendChild(popup);

    popup.querySelector('.anton-secret-close').onclick = function () {
      popup.remove();
    };

    popup.querySelector('.anton-secret-overlay').onclick = function (event) {
      if (event.target.classList.contains('anton-secret-overlay')) {
        popup.remove();
      }
    };
  }
})();
</script>
</body>
</html>
